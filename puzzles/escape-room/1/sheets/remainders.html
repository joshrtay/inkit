<!doctype html>
<html><head><meta charset="utf-8"><title>Remainders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&text=0123456789&display=block" rel="stylesheet">
<style>
  @page { size: letter; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  .sheet {
    position: relative; box-sizing: border-box;
    width: 215.9mm; height: 279.4mm; padding: 26mm 26mm;
    font-family: 'Kalam', cursive; color: #26398f;
    font-size: 15pt; line-height: 1.5;
  }
  .reg { position: absolute; width: 9mm; height: 9mm; border: 0 solid #26398f; }
  .tl { top: 10mm; left: 10mm; border-top-width: .5mm; border-left-width: .5mm; }
  .tr { top: 10mm; right: 10mm; border-top-width: .5mm; border-right-width: .5mm; }
  .bl { bottom: 10mm; left: 10mm; border-bottom-width: .5mm; border-left-width: .5mm; }
  .br { bottom: 10mm; right: 10mm; border-bottom-width: .5mm; border-right-width: .5mm; }

  p { margin: 0 0 4mm; }
  .ex { margin: 6mm 0 10mm; font-size: 13pt; border-collapse: collapse; }
  .ex td { padding: 1.6mm 4mm 1.6mm 0; white-space: nowrap; }
  .ex .lead { padding-right: 5mm; }
  .ex .new { padding-left: 3mm; }
  .steps { margin: 10mm 0 0 8mm; font-size: 17pt; border-collapse: collapse; }
  .steps td { height: 14mm; padding: 0; }
  .steps .div { width: 38mm; }
  .final-eq { margin-top: 12mm; font-size: 17pt; }
  .final { margin-top: 16mm; font-size: 17pt; display: flex; align-items: center; gap: 6mm; }
  .final .arrow { font-size: 13pt; }
</style></head>
<body>
<div class="sheet">
  <div class="reg tl"></div><div class="reg tr"></div><div class="reg bl"></div><div class="reg br"></div>

  <p>Use the quotient and the remainder to find a new number.</p>

  <table class="ex">
    <tr><td class="lead">ex.</td><td>30 &divide; 6</td><td>= 5 remainder 0</td><td class="new">&rarr; new number 50</td></tr>
    <tr><td class="lead">ex.</td><td>53 &divide; 3</td><td>= 17 remainder 2</td><td class="new">&rarr; new number 172</td></tr>
  </table>

  <p>Do this with your answer from before,<br>which we will call A.</p>

  <table class="steps">
    <tr><td class="div">A &divide; 12</td><td>for B</td></tr>
    <tr><td class="div">B &divide; 31</td><td>for C</td></tr>
    <tr><td class="div">C &divide; 25</td><td>for D</td></tr>
    <tr><td class="div">D &divide; 7</td><td>for E</td></tr>
  </table>

  <div class="final-eq">X + 30 &minus; 375000 = E</div>

  <div class="final">
    <span>Use X</span>
    <span class="arrow">&rarr; for Page 4</span>
  </div>
</div>
</body></html>
