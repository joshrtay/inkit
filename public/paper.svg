<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Paper texture for the page background: faint cloudy blotches plus fine grain,
       tiling seamlessly (stitchTiles). Drawn as warm gray with low alpha over the page color. -->
  <filter id="clouds" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="11" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.39  0 0 0 0 0.35  0.34 0 0 0 -0.1" />
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="5" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 0 0.3  0.12 0 0 0 -0.03" />
  </filter>
  <rect width="512" height="512" filter="url(#clouds)" />
  <rect width="512" height="512" filter="url(#grain)" />
</svg>
