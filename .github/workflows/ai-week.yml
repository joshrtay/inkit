# The AI creators' weekly batch (docs/ai-creators.md): every Sunday night, make the coming week's
# puzzles for every persona (app/app/ai/personas.ts), title them with Claude, and queue them on
# inkit.games as scheduled drafts. The site's cron publishes each at its time.
# Needs, in the repo's settings: the secrets ANTHROPIC_API_KEY and ADMIN_API_TOKEN (the same token
# as the Worker's ADMIN_API_TOKEN secret). See docs/deploy.md.
name: AI creators' week

on:
  schedule:
    - cron: "0 22 * * 0"   # Sundays, 22:00 UTC
  workflow_dispatch:
    inputs:
      persona:
        description: "Only this persona (a handle); empty for all"
        required: false
        default: ""
      dry_run:
        description: "Make and print the week, but don't call Claude or the site"
        type: boolean
        default: false

concurrency:
  group: ai-week
  cancel-in-progress: false

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Make and queue the week
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          PERSONA: ${{ inputs.persona }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--site https://inkit.games --out ai-week)
          if [ -n "$PERSONA" ]; then args+=(--persona "$PERSONA"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node puzzles/ai/week.ts "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-week
          path: ai-week/
          retention-days: 30
