# Deploy the social site (app/) to inkit.games on Cloudflare Workers on every push to main that
# touches it or the shared game engine (src/). Applies new database migrations first.
# Needs, in the repo's settings: the secret CLOUDFLARE_API_TOKEN (a token allowed to edit Workers
# and D1) and the variable CLOUDFLARE_ACCOUNT_ID.
# (wyattsgames.com, the Astro site, has its own workflow: deploy.yml.)
name: Deploy inkit.games

on:
  push:
    branches: [main]
    paths: ["app/**", "src/**", "package.json", "package-lock.json", ".github/workflows/deploy-inkit.yml"]
  workflow_dispatch:

concurrency:
  group: inkit
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # the app builds the shared engine in src/, whose packages are installed at the root
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply wyattsgames-db --remote
        working-directory: app
      - name: Build and deploy
        run: npm run deploy
        working-directory: app
