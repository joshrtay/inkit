# Test inkit on every push and pull request; deploy it to inkit.games (Cloudflare Workers) on
# pushes to main that touch the site or the shared engine, once the tests pass. Deploying applies
# new database migrations first.
# Needs, in the repo's settings: the secret CLOUDFLARE_API_TOKEN (allowed to edit Workers and D1)
# and the variable CLOUDFLARE_ACCOUNT_ID.
name: Test and deploy inkit.games

on:
  push:
    branches: [main, social]
  pull_request:
  workflow_dispatch:

concurrency:
  group: inkit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # one install for the shared code and the site (npm workspaces)
      - run: npm ci
      - name: Shared code (type check, engine self-test)
        run: npm run build && npm run selftest
      # the type check reads the secrets' names from .dev.vars (never committed): the example
      # lists the same names with placeholders, which also serve the local site in the browser tests
      - name: Site (type check, unit tests)
        run: cp .dev.vars.example .dev.vars && npm run typecheck && npm test
        working-directory: app
      - name: Local database for the browser tests
        run: npm run db:migrate && python3 seed/make.py && npm run db:seed
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Browser tests (the editor, every puzzle type)
        run: npm run test:e2e
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: app/test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply wyattsgames-db --remote
        working-directory: app
      - name: Build and deploy
        run: npm run deploy
        working-directory: app
